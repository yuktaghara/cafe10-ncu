<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Café 10 - Admin & Kitchen Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background-color: #121212; color: #ffffff; padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #2a2a2a; flex-wrap: wrap; gap: 10px; }
    
    .brand-title { display: flex; align-items: center; gap: 15px; }
    .logo-container { background: #ffffff; padding: 4px 12px; border-radius: 8px; display: inline-flex; align-items: center; }
    .university-logo { height: 36px; width: auto; object-fit: contain; }

    h1 { font-size: 18px; color: #ffc107; display: flex; align-items: center; gap: 8px; }

    .header-actions { display: flex; align-items: center; gap: 12px; }
    .metrics { background: #222; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #444; }

    /* Navigation Tabs */
    .view-tabs { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .tab-group { display: flex; gap: 10px; }
    .tab-btn { background: #222; color: #aaa; border: 1px solid #333; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #ffc107; color: #000; border-color: #ffc107; }

    .btn-manual { background: #0275d8; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }

    /* Sub Filters */
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    .filter-group { display: flex; gap: 10px; }
    .filter-btn { background: #222; color: #aaa; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: #800000; color: #fff; border-color: #800000; }

    .sound-toggle { font-size: 12px; color: #aaa; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* Orders Grid */
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 15px; margin-top: 20px; }
    .order-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 18px; text-align: center; border-top: 4px solid #ffc107; position: relative; }
    .order-card.completed { border-top-color: #28a745; opacity: 0.6; }

    .token { font-size: 32px; font-weight: 700; color: #28a745; }
    .item { font-size: 13px; margin: 8px 0; font-weight: 600; color: #e0e0e0; line-height: 1.4; }
    .instructions { font-size: 11px; color: #ffc107; background: #2a2200; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; }
    .price-tag { font-size: 12px; color: #aaa; font-weight: 600; margin-bottom: 8px; }
    .time { font-size: 11px; color: #666; }

    .btn-ready { margin-top: 12px; width: 100%; background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-completed { margin-top: 12px; width: 100%; background: #333; color: #777; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: default; }

    /* Menu Manager Layout */
    .menu-manager { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-top: 20px; }
    @media (max-width: 768px) { .menu-manager { grid-template-columns: 1fr; } }

    .form-card { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 12px; height: fit-content; }
    .form-card h2 { font-size: 15px; margin-bottom: 15px; color: #ffc107; }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: white; font-size: 12px; }

    .btn-save { width: 100%; background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 5px; }

    .menu-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .search-input { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; color: white; font-size: 12px; width: 180px; }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .item-card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; position: relative; }
    .item-card.sold-out { opacity: 0.4; }

    .item-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .item-meta { font-size: 12px; color: #ffc107; margin-bottom: 8px; }
    .badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #333; color: #ccc; display: inline-block; margin-bottom: 8px; }

    .item-actions { display: flex; gap: 6px; }
    .btn-action { flex: 1; padding: 6px; border: none; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; }
    .btn-toggle { background: #0275d8; color: white; }
    .btn-delete { background: #d9534f; color: white; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #1e1e1e; border: 1px solid #444; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <div class="brand-title">
      <div class="logo-container">
        <img src="northcap uni cutout.png" alt="NCU Logo" class="university-logo" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/The_NorthCap_University_logo.png/640px-The_NorthCap_University_logo.png';">
      </div>
      <h1><i class="fa-solid fa-kitchen-set"></i> Kitchen Portal</h1>
    </div>
    <div class="header-actions">
      <div class="metrics">Queue: <span id="pendingCount" style="color: #ffc107;">0</span></div>
      <div class="metrics">Today's Sales: <span id="totalRevenue" style="color: #28a745;">₹0</span></div>
    </div>
  </header>

  <!-- View Switcher Tabs -->
  <div class="view-tabs">
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchView('orders', this)"><i class="fa-solid fa-list-check"></i> Live Orders</button>
      <button class="tab-btn" onclick="switchView('menu', this)"><i class="fa-solid fa-utensils"></i> Menu Manager</button>
    </div>
    <button class="btn-manual" onclick="openManualOrderModal()"><i class="fa-solid fa-plus"></i> Manual Order</button>
  </div>

  <!-- SECTION 1: LIVE ORDERS VIEW -->
  <div id="ordersSection">
    <div class="filter-bar">
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('preparing', this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Completed Today</button>
      </div>
      <label class="sound-toggle">
        <input type="checkbox" id="soundToggle" checked> Sound Alerts
      </label>
    </div>
    <div class="orders-grid" id="ordersList"></div>
  </div>

  <!-- SECTION 2: MENU MANAGER VIEW -->
  <div id="menuSection" style="display: none;" class="menu-manager">
    <div class="form-card">
      <h2>Add / Edit Item</h2>
      <div class="form-group"><label>Item Name</label><input type="text" id="itemName" placeholder="e.g. Paneer Patty"></div>
      <div class="form-group"><label>Price (₹)</label><input type="number" id="itemPrice" placeholder="e.g. 50"></div>
      <div class="form-group">
        <label>Category</label>
        <select id="itemCategory">
          <option value="meals">Meals</option>
          <option value="drinks">Beverages</option>
          <option value="snacks">Snacks</option>
          <option value="specials">Specials</option>
        </select>
      </div>
      <div class="form-group">
        <label>Dietary Type</label>
        <select id="itemDiet">
          <option value="veg">Vegetarian</option>
          <option value="nonveg">Non-Vegetarian</option>
        </select>
      </div>
      <div class="form-group" id="dayGroup" style="display: none;">
        <label>Special Day</label>
        <select id="itemDay">
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
        </select>
      </div>
      <button class="btn-save" onclick="saveMenuItem()">Save Item</button>
    </div>

    <div>
      <div class="menu-header-bar">
        <h2 style="font-size: 15px; color: #ffc107;">Active Menu Items</h2>
        <input type="text" id="adminSearch" class="search-input" placeholder="Search menu..." onkeyup="filterAdminMenu()">
      </div>
      <div class="menu-grid" id="menuAdminGrid"></div>
    </div>
  </div>

  <!-- Manual Order Modal -->
  <div id="manualModal" class="modal">
    <div class="modal-content">
      <h3 style="font-size: 15px; margin-bottom: 12px; color: #ffc107;">Create Counter Order</h3>
      <div class="form-group"><label>Items Summary</label><input type="text" id="manualItem" placeholder="e.g., 2x Cold Coffee, 1x Sandwich"></div>
      <div class="form-group"><label>Total Amount (₹)</label><input type="number" id="manualPrice" placeholder="140"></div>
      <div class="form-group"><label>Notes / Instructions</label><input type="text" id="manualNote" placeholder="Counter Cash Order"></div>
      <div style="display: flex; gap: 8px; margin-top: 15px;">
        <button class="btn-save" style="background:#555;" onclick="closeManualOrderModal()">Cancel</button>
        <button class="btn-save" onclick="submitManualOrder()">Create Order</button>
      </div>
    </div>
  </div>

  <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrBalu22OBYfa7y0OjtxHKsxIeyzzRbFc",
      authDomain: "cafe10-ncu.firebaseapp.com",
      databaseURL: "https://cafe10-ncu-default-rtdb.firebaseio.com",
      projectId: "cafe10-ncu",
      storageBucket: "cafe10-ncu.firebasestorage.app",
      messagingSenderId: "673141418172",
      appId: "1:673141418172:web:283db827e372bd429c88b9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentFilter = 'preparing';
    let previousCount = 0;
    let allOrders = {};
    let allMenuItems = {};

    document.getElementById('itemCategory').addEventListener('change', (e) => {
      document.getElementById('dayGroup').style.display = e.target.value === 'specials' ? 'block' : 'none';
    });

    function switchView(view, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('ordersSection').style.display = view === 'orders' ? 'block' : 'none';
      document.getElementById('menuSection').style.display = view === 'menu' ? 'grid' : 'none';
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    db.ref('orders').on('value', (snapshot) => {
      allOrders = snapshot.val() || {};
      renderOrders();
    });

    db.ref('menu').on('value', (snapshot) => {
      allMenuItems = snapshot.val() || {};
      renderAdminMenu();
    });

    function renderOrders() {
      const ordersList = document.getElementById('ordersList');
      ordersList.innerHTML = ''; 
      let activeCount = 0;
      let revenue = 0;

      for (let token in allOrders) {
        const order = allOrders[token];
        if (order.status === 'Preparing') activeCount++;
        if (order.price) revenue += parseInt(order.price);

        const isPreparing = order.status === 'Preparing';
        if ((currentFilter === 'preparing' && isPreparing) || (currentFilter === 'completed' && !isPreparing)) {
          ordersList.innerHTML += `
            <div class="order-card ${!isPreparing ? 'completed' : ''}">
              <div class="token">#${order.token}</div>
              <div class="item">${order.item}</div>
              ${order.note ? `<div class="instructions"><i class="fa-regular fa-comment"></i> ${order.note}</div>` : ''}
              <div class="price-tag">Total: ₹${order.price}</div>
              <div class="time"><i class="fa-regular fa-clock"></i> ${order.time}</div>
              ${isPreparing ? 
                `<button class="btn-ready" onclick="completeOrder(${order.token})">Mark Ready</button>` : 
                `<button class="btn-completed">Completed</button>`
              }
            </div>
          `;
        }
      }

      document.getElementById('pendingCount').innerText = activeCount;
      document.getElementById('totalRevenue').innerText = `₹${revenue}`;

      if (activeCount > previousCount && previousCount !== 0 && document.getElementById('soundToggle').checked) {
        document.getElementById('orderSound').play().catch(() => {});
      }
      previousCount = activeCount;
    }

    function completeOrder(token) {
      db.ref('orders/' + token).update({ status: 'Completed' });
    }

    function saveMenuItem() {
      const name = document.getElementById('itemName').value.trim();
      const price = parseInt(document.getElementById('itemPrice').value);
      const category = document.getElementById('itemCategory').value;
      const diet = document.getElementById('itemDiet').value;
      const day = category === 'specials' ? parseInt(document.getElementById('itemDay').value) : 0;

      if (!name || isNaN(price)) return alert('Fill out name and price.');

      const itemId = name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();

      db.ref('menu/' + itemId).set({
        id: itemId, name: name, price: price, category: category, diet: diet, day: day, available: true
      }).then(() => {
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
      });
    }

    function renderAdminMenu() {
      const container = document.getElementById('menuAdminGrid');
      const query = document.getElementById('adminSearch').value.toLowerCase();
      container.innerHTML = '';

      for (let key in allMenuItems) {
        const item = allMenuItems[key];
        if (query && !item.name.toLowerCase().includes(query)) continue;

        container.innerHTML += `
          <div class="item-card ${!item.available ? 'sold-out' : ''}">
            <div class="item-title">${item.name}</div>
            <div class="item-meta">₹${item.price}</div>
            <span class="badge">${item.category.toUpperCase()}</span>
            <div class="item-actions">
              <button class="btn-action btn-toggle" onclick="toggleStock('${item.id}', ${!item.available})">
                ${item.available ? 'Sold Out' : 'Available'}
              </button>
              <button class="btn-action btn-delete" onclick="deleteMenuItem('${item.id}')">Delete</button>
            </div>
          </div>
        `;
      }
    }

    function filterAdminMenu() { renderAdminMenu(); }
    function toggleStock(id, status) { db.ref('menu/' + id).update({ available: status }); }
    function deleteMenuItem(id) { if (confirm("Delete item?")) db.ref('menu/' + id).remove(); }

    function openManualOrderModal() { document.getElementById('manualModal').style.display = 'flex'; }
    function closeManualOrderModal() { document.getElementById('manualModal').style.display = 'none'; }

    function submitManualOrder() {
      const item = document.getElementById('manualItem').value.trim();
      const price = document.getElementById('manualPrice').value;
      const note = document.getElementById('manualNote').value.trim();

      if (!item || !price) return alert('Enter item details and price.');

      db.ref('lastToken').transaction((curr) => (curr || 100) + 1, (err, committed, snap) => {
        if (committed) {
          const newToken = snap.val();
          db.ref('orders/' + newToken).set({
            item: item, price: price, note: note || 'Counter Order', token: newToken, status: 'Preparing', time: new Date().toLocaleTimeString()
          });
          closeManualOrderModal();
        }
      });
    }
  </script>
</body>
</html>
